<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1d1712"/>
      <stop offset="55%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#0b0906"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c15c"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a1f"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c15c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (this fills the icon edge-to-edge behind any OS mask) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="220" fill="url(#glow)"/>

  <!-- medallion rings, echoing the Pantheon medals / wax-seal motif used across the app -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#e2c15c" stroke-width="1.4" opacity="0.35"/>

  <!-- the feather-quill mark, enlarged from the site's nav/footer logo, centered in the medallion's safe zone -->
  <g transform="translate(137.5,101) scale(11.5)" fill="none" stroke="url(#goldSoft)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" fill="#c9a227" fill-opacity="0.14"/>
    <line x1="16" y1="8" x2="2" y2="22"/>
    <line x1="17.5" y1="15" x2="9" y2="15"/>
    <line x1="14.5" y1="11.5" x2="7" y2="11.5"/>
    <path d="M2 22c-0.8 0.8 -1.3 1.7 -1.6 2.6"/>
  </g>

  <!-- small ink flourish beneath the nib, standing in for the "A" of Aeterna -->
  <path d="M198 372c22 14 94 14 116 0" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>
